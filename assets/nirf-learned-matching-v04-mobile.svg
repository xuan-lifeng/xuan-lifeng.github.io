<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120" role="img" aria-label="Learned appearance, fixed geometry"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b42}.sub{fill:#61768b}</style><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2877b5"/></marker></defs><text font-family="Arial,Helvetica,sans-serif" x="30" y="38" font-size="25" font-weight="600">Learned appearance, fixed geometry</text><text font-family="Arial,Helvetica,sans-serif" class="sub" x="30" y="68" font-size="14">Learned H uses a CNN appearance cost</text><rect x="55" y="110" width="510" height="90" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="160.0" text-anchor="middle" font-size="16" style="fill:#172b42">Paired 49 × 49 NIRF patches</text><path d="M310 202 L310 227" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="310,227 305.0,217.0 315.0,217.0" fill="#2877b5"/><rect x="55" y="230" width="510" height="90" rx="8" fill="#087f78" stroke="#087f78"/><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="269.0" text-anchor="middle" font-size="16" style="fill:white">Shared Siamese CNN</text><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="292.0" text-anchor="middle" font-size="16" style="fill:white">64-dimensional, unit-normalised embeddings</text><path d="M310 322 L310 347" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="310,347 305.0,337.0 315.0,337.0" fill="#2877b5"/><rect x="55" y="350" width="510" height="90" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="389.0" text-anchor="middle" font-size="16" style="fill:#172b42">Compare embeddings</text><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="412.0" text-anchor="middle" font-size="16" style="fill:#172b42">Absolute difference and elementwise product</text><path d="M310 442 L310 467" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="310,467 305.0,457.0 315.0,457.0" fill="#2877b5"/><rect x="55" y="470" width="510" height="90" rx="8" fill="#087f78" stroke="#087f78"/><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="520.0" text-anchor="middle" font-size="16" style="fill:white">Match probability → appearance cost</text><path d="M310 562 L310 587" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="310,587 305.0,577.0 315.0,577.0" fill="#2877b5"/><rect x="55" y="590" width="510" height="90" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="629.0" text-anchor="middle" font-size="16" style="fill:#172b42">Unary cost</text><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="652.0" text-anchor="middle" font-size="16" style="fill:#172b42">Epipolar row penalty + weighted CNN cost</text><path d="M310 682 L310 707" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="310,707 305.0,697.0 315.0,697.0" fill="#2877b5"/><rect x="55" y="710" width="510" height="90" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="760.0" text-anchor="middle" font-size="16" style="fill:#172b42">Monotone sequence matching</text><path d="M310 802 L310 827" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="310,827 305.0,817.0 315.0,817.0" fill="#2877b5"/><rect x="55" y="830" width="510" height="90" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="880.0" text-anchor="middle" font-size="16" style="fill:#172b42">Accepted matches → calibrated 3D</text><rect x="40" y="975" width="540" height="105" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="1021.5" text-anchor="middle" font-size="16" style="fill:#172b42">Fixed constraints: disparity bounds, row tolerance,</text><text font-family="Arial,Helvetica,sans-serif" x="310.0" y="1044.5" text-anchor="middle" font-size="16" style="fill:#172b42">ordering, smoothness, skipping and endpoints</text></svg>