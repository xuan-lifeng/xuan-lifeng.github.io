xt><text font-family="Arial,Helvetica,sans-serif" x="599.0" y="179.5" text-anchor="middle" font-size="16" style="fill:#172b42">extraction</text><path d="M696 162 L736 162" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="736,162 726.0,167.0 726.0,157.0" fill="#2877b5"/><rect x="741" y="110" width="190" height="105" rx="8" fill="#087f78" stroke="#087f78"/><text font-family="Arial,Helvetica,sans-serif" x="836.0" y="156.5" text-anchor="middle" font-size="16" style="fill:white">Constrained</text><text font-family="Arial,Helvetica,sans-serif" x="836.0" y="179.5" text-anchor="middle" font-size="16" style="fill:white">correspondence</text><path d="M933 162 L973 162" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="973,162 963.0,167.0 963.0,157.0" fill="#2877b5"/><rect x="978" y="110" width="190" height="105" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="1073.0" y="156.5" text-anchor="middle" font-size="16" style="fill:#172b42">Calibrated</text><text font-family="Arial,Helvetica,sans-serif" x="1073.0" y="179.5" text-anchor="middle" font-size="16" style="fill:#172b42">triangulation</text><text font-family="Arial,Helvetica,sans-serif" x="600" y="264" text-anchor="middle" font-size="16" style="fill:#172b42">Ground-truth substitutions isolated correspondence as the main depth-error bottleneck.</text></svg>