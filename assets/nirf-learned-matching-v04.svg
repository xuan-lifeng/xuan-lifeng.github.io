<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Learned appearance, fixed geometry"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b42}.sub{fill:#61768b}</style><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2877b5"/></marker></defs><text font-family="Arial,Helvetica,sans-serif" x="30" y="38" font-size="25" font-weight="600">Learned appearance, fixed geometry</text><text font-family="Arial,Helvetica,sans-serif" class="sub" x="30" y="68" font-size="14">Learned H replaces the appearance score inside a shared constrained matcher</text><rect x="30" y="125" width="190" height="110" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="125.0" y="174.0" text-anchor="middle" font-size="16" style="fill:#172b42">Paired 49 × 49</text><text font-family="Arial,Helvetica,sans-serif" x="125.0" y="197.0" text-anchor="middle" font-size="16" style="fill:#172b42">NIRF patches</text><rect x="270" y="125" width="240" height="110" rx="8" fill="#087f78" stroke="#087f78"/><text font-family="Arial,Helvetica,sans-serif" x="390.0" y="174.0" text-anchor="middle" font-size="16" style="fill:white">Shared Siamese CNN</text><text font-family="Arial,Helvetica,sans-serif" x="390.0" y="197.0" text-anchor="middle" font-size="16" style="fill:white">64-dimensional embeddings</text><rect x="560" y="125" width="240" height="110" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="680.0" y="174.0" text-anchor="middle" font-size="16" style="fill:#172b42">Embedding comparison</text><text font-family="Arial,Helvetica,sans-serif" x="680.0" y="197.0" text-anchor="middle" font-size="16" style="fill:#172b42">|eL − eR| and eL × eR</text><rect x="850" y="125" width="300" height="110" rx="8" fill="#087f78" stroke="#087f78"/><text font-family="Arial,Helvetica,sans-serif" x="1000.0" y="174.0" text-anchor="middle" font-size="16" style="fill:white">Match probability</text><text font-family="Arial,Helvetica,sans-serif" x="1000.0" y="197.0" text-anchor="middle" font-size="16" style="fill:white">p(i,j)</text><path d="M222 180 L265 180" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="265,180 255.0,185.0 255.0,175.0" fill="#2877b5"/><path d="M512 180 L555 180" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="555,180 545.0,185.0 545.0,175.0" fill="#2877b5"/><path d="M802 180 L845 180" fill="none" stroke="#2877b5" stroke-width="2"/><polygon points="845,180 835.0,185.0 835.0,175.0" fill="#2877b5"/><rect x="30" y="335" width="245" height="105" rx="8" fill="#087f78" stroke="#087f78"/><text font-family="Arial,Helvetica,sans-serif" x="152.5" y="381.5" text-anchor="middle" font-size="16" style="fill:white">Relative CNN</text><text font-family="Arial,Helvetica,sans-serif" x="152.5" y="404.5" text-anchor="middle" font-size="16" style="fill:white">appearance cost</text><rect x="325" y="335" width="245" height="105" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="447.5" y="381.5" text-anchor="middle" font-size="16" style="fill:#172b42">Unary cost</text><text font-family="Arial,Helvetica,sans-serif" x="447.5" y="404.5" text-anchor="middle" font-size="16" style="fill:#172b42">Row penalty + CNN cost</text><rect x="620" y="335" width="245" height="105" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="742.5" y="381.5" text-anchor="middle" font-size="16" style="fill:#172b42">Monotone sequence</text><text font-family="Arial,Helvetica,sans-serif" x="742.5" y="404.5" text-anchor="middle" font-size="16" style="fill:#172b42">dynamic programme</text><rect x="915" y="335" width="245" height="105" rx="8" fill="#f3f7fa" stroke="#d7e1eb"/><text font-family="Arial,Helvetica,sans-serif" x="1037.5" y="